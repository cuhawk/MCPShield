[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpshield"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "httpx", "pyyaml", "opentelemetry-api", "fastapi", "uvicorn", "jsonschema"]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.scripts]
mcpshield = "mcpshield.cli:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
